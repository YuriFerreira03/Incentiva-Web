name: Atualizar projetos autorizados

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC = 06:00 em Brasília
  workflow_dispatch: # permite rodar na mão: aba Actions > Run workflow

permissions:
  contents: read

concurrency:
  group: atualizar-aptos
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: robo/requirements.txt

      - name: Instalar dependências
        run: pip install -r robo/requirements.txt

      - name: Baixar planilha do gov.br
        run: python robo/baixar_aptos.py

      - name: Limpar e normalizar
        run: python robo/importar_aptos.py aptos.xlsx

      - name: Enviar para o Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python robo/enviar_supabase.py saida/aptos_supabase.csv

      - name: Guardar relatório de linhas para revisar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aptos-revisar
          path: saida/aptos_revisar.csv
          retention-days: 14
          if-no-files-found: ignore
